version: 2

sources:
  - name: raw
    description: Files landed by the source system and loaded as-is by ingestion/load_raw.py.
    schema: raw
    tables:
      - name: customers
        columns:
          - name: customer_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]
      - name: products
        columns:
          - name: product_id
            data_tests: [not_null]
      - name: orders
        columns:
          - name: order_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]
      - name: order_items
        columns:
          - name: order_id
            data_tests: [not_null]
      - name: payments
        columns:
          - name: payment_id
            data_tests: [not_null]
      - name: _load_audit
        description: One row per table per batch day, written by the loader. Feeds pipeline health.
