# Local Airflow 3: Postgres metadata DB, API server (UI), scheduler, DAG processor.
# LocalExecutor runs tasks as subprocesses of the scheduler, so the DuckDB file is only
# ever written by one container.
#   1. cp .env.example .env
#   2. docker compose up --build -d
#   3. open http://localhost:8080 (user "admin", local mode: no password)

x-airflow-common: &airflow-common
  build: .
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/orchestration/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # local development only
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-to-a-long-random-string}
    PYTHONPATH: /opt/airflow/project
    ECOM_DATA_DIR: /opt/airflow/project/data/landing
    ECOM_DUCKDB_PATH: /opt/airflow/project/data/warehouse/ecom.duckdb
    DBT_PROJECT_DIR: /opt/airflow/project/dbt_project
    DBT_BIN: /home/airflow/dbt-venv/bin/dbt
  volumes:
    - .:/opt/airflow/project
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "mkdir -p /opt/airflow/project/data && airflow db migrate"]

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["8080:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init: {condition: service_completed_successfully}

volumes:
  pgdata:
  airflow-logs:
